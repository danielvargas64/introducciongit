<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>
    <link rel="stylesheet" href="css/loginstyle.css"> 

</head>
<body>

    <div class="login-container">
        <h2>Iniciar Sesión</h2>
        <form action="#" method="POST">
            
            <div class="input-group">
                <label for="username">Correo electrónico o usuario</label>
                <input type="text" id="username" name="username" placeholder="ejemplo@correo.com" required>
            </div>

            <div class="input-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="Tu contraseña" required>
            </div>

            <div class="remember-forget">
                <label>
                    <input type="checkbox" name="remember"> Recordarme
                </label>
                <a href="#">¿Olvidaste tu contraseña?</a>
            </div>

            <button type="submit" class="btn-login" href="./gestionusuarios/crearusuarios.php">Ingresar</button>

            <div class="register-link">
                <p>¿No tienes cuenta? <a href="#">Regístrate aquí</a></p>
            </div>
        </form>
    </div>

</body>
</html>
